version: "3.8"

services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: node-app

    ports:
      - "3001:3000"

    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

    networks:
      - test-network

  postgres:
    image: postgres:15-alpine

    container_name: postgres-db

    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass

    ports:
      - "5433:5432"

    networks:
      - test-network

  redis:
    image: redis:7-alpine

    container_name: redis-cache

    ports:
      - "6380:6379"

    networks:
      - test-network

networks:
  test-network:
    driver: bridge